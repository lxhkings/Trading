[project]
name = "trading"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "futu-api>=9.0",
  "redis>=5.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fakeredis>=2.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trading*"]